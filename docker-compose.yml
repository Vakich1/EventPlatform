services:
  postgres:
    image: postgres:16-alpine
    container_name: eventplatform_postgres
    environment:
      POSTGRES_DB: eventplatform
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: eventplatform_redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: eventplatform_api
    ports:
      - "5220:5220"
    environment:
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=eventplatform;Username=postgres;Password=postgres
      - ConnectionStrings__Redis=redis:6379
      - JwtSettings__Secret=your-super-secret-key-that-is-at-least-32-characters
      - JwtSettings__Issuer=EventPlatform
      - JwtSettings__Audience=EventPlatform
      - JwtSettings__ExpiresInMinutes=60
      - JwtSettings__RefreshTokenExpiresInDays=7
      - StripeSettings__SecretKey=your-stripe-secret-key
      - StripeSettings__WebhookSecret=your-stripe-webhook-secret
      - EmailSettings__SmtpHost=smtp.mailtrap.io
      - EmailSettings__SmtpPort=587
      - EmailSettings__SenderName=Event Platform
      - EmailSettings__SenderEmail=your-email@example.com
      - EmailSettings__Username=your-mailtrap-username
      - EmailSettings__Password=your-mailtrap-password
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: eventplatform_frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:5220
    depends_on:
      - api

volumes:
  postgres_data:
